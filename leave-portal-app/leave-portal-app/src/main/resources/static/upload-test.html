<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Portal - OCI Upload Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 40px 16px;
        }
        .card {
            max-width: 640px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 32px;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 6px;
            color: #1a202c;
        }
        p.sub {
            margin: 0 0 24px;
            color: #718096;
            font-size: 14px;
        }
        label {
            display: block;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            color: #2d3748;
        }
        input[type="file"] {
            display: block;
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            background: #fafbfc;
            font-size: 14px;
            box-sizing: border-box;
        }
        button {
            margin-top: 16px;
            width: 100%;
            padding: 12px;
            background: #2b6cb0;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover {
            background: #2c5282;
        }
        button:disabled {
            background: #a0aec0;
            cursor: not-allowed;
        }
        pre {
            margin-top: 24px;
            background: #1a202c;
            color: #cbd5e0;
            padding: 16px;
            border-radius: 8px;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
            display: none;
            max-height: 400px;
            overflow: auto;
        }
        .ok {
            border-left: 4px solid #38a169;
        }
        .err {
            border-left: 4px solid #e53e3e;
        }
        .status {
            margin-top: 12px;
            font-size: 14px;
            color: #718096;
            display: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>OCI Object Storage Upload Test</h1>
        <p class="sub">Upload a .txt file to <strong>sick-leaves-bucket</strong> via <code>/api/leave/upload</code>. Requires an active browser login session.</p>

        <label for="fileInput">Choose a .txt file</label>
        <input type="file" id="fileInput" accept=".txt">
        <button id="uploadBtn" type="button">Upload</button>

        <div class="status" id="status"></div>
        <pre id="output"></pre>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const status = document.getElementById('status');
        const output = document.getElementById('output');

        uploadBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) {
                showStatus('Please select a .txt file first.', true);
                return;
            }

            const formData = new FormData();
            formData.append('file', file);

            uploadBtn.disabled = true;
            showStatus('Uploading...', false);
            output.style.display = 'none';

            try {
                const response = await fetch('/api/leave/upload', {
                    method: 'POST',
                    body: formData
                });

                const text = await response.text();
                let body;
                try {
                    body = JSON.parse(text);
                } catch (e) {
                    body = text;
                }

                output.textContent = JSON.stringify(body, null, 2);
                output.className = response.ok ? 'ok' : 'err';
                output.style.display = 'block';

                if (response.ok) {
                    showStatus('Upload succeeded.', false);
                } else if (response.status === 401 || response.status === 403) {
                    showStatus('Not authenticated. Log in at http://localhost:8080 first, then reload this page.', true);
                } else {
                    showStatus('Upload failed (HTTP ' + response.status + ').', true);
                }
            } catch (error) {
                output.textContent = 'Request error: ' + error.message;
                output.className = 'err';
                output.style.display = 'block';
                showStatus('Request failed.', true);
            } finally {
                uploadBtn.disabled = false;
            }
        });

        function showStatus(message, isError) {
            status.textContent = message;
            status.style.display = 'block';
            status.style.color = isError ? '#e53e3e' : '#718096';
        }
    </script>
</body>
</html>
